<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" sizes="32x32" href="/faviconn.jpeg" />
  <link rel="icon" type="image/jpeg" sizes="192x192" href="/faviconn.jpeg" />
  <link rel="apple-touch-icon" href="/faviconn.jpeg" />

  <!-- SEO -->
  <meta name="author" content="CodeWild LearningHub" />

  <title>CodeWild LearningHub – Learn Coding with Corporate Mentorship</title>
  <meta name="description"
    content="Join CodeWild LearningHub to learn coding with corporate mentorship, real-world projects, and career-focused training." />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0a" />

  <!-- Preconnect to external image assets -->
  <link rel="preconnect" href="https://images.pexels.com" crossorigin>

  <!-- Critical CSS Inlined for instant Hero rendering -->
  <style>
    @keyframes fadeUpSlow {
      0% {
        opacity: 0;
        transform: translateY(30px) scale(0.96);
      }

      60% {
        opacity: 1;
        transform: translateY(-4px) scale(1.02);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes arrowPulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.08);
      }
    }

    .animate-fadeUpSlow {
      animation: fadeUpSlow 0.9s cubic-bezier(0.19, 1, 0.22, 1) forwards;
    }

    .animate-arrowPulse {
      animation: arrowPulse 1.5s ease-in-out infinite;
    }

    .bg-radial-at-b {
      background: radial-gradient(circle at bottom, rgba(248, 113, 22, 0.35), transparent 65%);
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
